server:
  port: 8719

spring:
  profiles:
    active: prod
  kernel-register:
    name: petrel-kernel-user
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 202.189.7.196:6878

  autoconfigure:
    exclude: com.alibaba.druid.spring.boot.autoconfigure.DruidDataSourceAutoConfigure

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    dynamic:
      primary: petrel_core
      strict: false
      datasource:
        petrel_core:
          druid:
            initial-size: 8
            min-idle: 8
            maxActive: 64
            maxWait: 60000
            useUnfairLock: true
            timeBetweenEvictionRunsMillis: 60000
            minEvictableIdleTimeMillis: 300000
            validationQuery: SELECT 1
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            filters: stat
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://202.189.7.196:3306/petrel_core?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&serverTimezone=Asia/Shanghai
          username: root
          password: Fagp@1908!
        petrel_record:
          druid:
            initial-size: 4
            min-idle: 4
            maxActive: 64
            maxWait: 60000
            useUnfairLock: true
            timeBetweenEvictionRunsMillis: 60000
            minEvictableIdleTimeMillis: 300000
            validationQuery: SELECT 1
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            filters: stat
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://202.189.7.196:3306/petrel_record?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&serverTimezone=Asia/Shanghai
          username: root
          password: Fagp@1908!

